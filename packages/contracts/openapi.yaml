# DRAFT from the MVP spec. Change only by a PR approved by all three owners.
openapi: 3.1.0
info: { title: Tkallem API, version: 0.1.0 }
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk session token
  schemas:
    Correction:
      type: object
      required: [original, fixed, type, why]
      properties:
        original: { type: string }
        fixed: { type: string }
        type: { type: string, enum: [grammar, vocabulary, word_choice, other] }
        why: { type: string, description: Explanation in the session explain_lang }
    SentenceStatus: { type: string, enum: [green, orange, red] }
    Me:
      type: object
      required: [first_name, level, explain_lang]
      properties:
        first_name: { type: [string, "null"] }
        level:
          type: [string, "null"]
          enum: [A2, B1, B2, C1, null]
          description: null until the student picks a level
        explain_lang: { type: string, enum: [en, fr] }
    MeUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        level: { type: string, enum: [A2, B1, B2, C1] }
        explain_lang: { type: string, enum: [en, fr] }
    Turn:
      type: object
      required: [transcript, reply, corrections, sentence_status, finished]
      properties:
        transcript: { type: string }
        reply: { type: string }
        reply_audio_url: { type: [string, "null"] }
        corrections:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/Correction" }
        sentence_status: { $ref: "#/components/schemas/SentenceStatus" }
        finished:
          type: boolean
          description: True once every question of a guided scenario is answered (show the report button). Always false in free talk.
paths:
  /sessions:
    post:
      summary: Start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scenario_id]
              properties:
                scenario_id: { type: string }
                mode: { type: string, enum: [text, voice], default: text }
                explain_lang:
                  type: string
                  enum: [en, fr]
                  description: Defaults to the student's profile preference (GET /me).
      responses:
        "200":
          description: Session started
          content:
            application/json:
              schema:
                type: object
                required: [session_id, first_question]
                properties:
                  session_id: { type: string }
                  first_question:
                    type: object
                    properties:
                      text: { type: string }
                      audio_url: { type: [string, "null"] }
        "401": { description: Missing or invalid token }
        "404": { description: Unknown scenario }
        "409": { description: The student has not chosen a level yet (PATCH /me first) }
        "422": { description: Invalid body }
  /sessions/{id}/turn:
    post:
      summary: Send one student turn (audio file or text)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                audio: { type: string, format: binary }
                text: { type: string }
      responses:
        "200":
          description: Coach reply with corrections
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Turn" }
        "401": { description: Missing or invalid token }
        "404": { description: Session not found }
        "409": { description: Session already ended, or another answer was saved meanwhile (reload the session) }
        "422": { description: Empty or too long answer, or invalid session id }
        "502": { description: The coach failed. Nothing was saved, the student can send the same answer again }
  /sessions/{id}/end:
    post:
      summary: End the session and get the report
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                type: object
                required: [lines, note, metrics, levels, redo_index]
                properties:
                  lines:
                    type: array
                    items:
                      type: object
                      properties:
                        role: { type: string, enum: [coach, student] }
                        text: { type: string }
                        status: { $ref: "#/components/schemas/SentenceStatus" }
                        corrections:
                          type: array
                          items: { $ref: "#/components/schemas/Correction" }
                  note: { type: string }
                  metrics: { $ref: "#/paths/~1me~1progress/get/responses/200/content/application~1json/schema/properties/current" }
                  levels:
                    type: object
                    description: Traffic light per metric, null when the metric is not available (e.g. hesitations in text mode)
                    properties:
                      mistakes_per_100: { type: [string, "null"], enum: [green, orange, red, null] }
                      words_per_answer: { type: [string, "null"], enum: [green, orange, red, null] }
                      hesitations_per_min: { type: [string, "null"], enum: [green, orange, red, null] }
                  redo_index:
                    type: [integer, "null"]
                    description: Index in lines of the answer to redo first, if any
        "401": { description: Missing or invalid token }
        "404": { description: Session not found }
        "409": { description: Session already ended, or no answer given yet }
        "502": { description: The report could not be generated. Nothing was saved, try again }
  /me/progress:
    get:
      summary: Progress numbers and frequent mistakes
      responses:
        "200":
          description: Progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  current:
                    type: object
                    properties:
                      mistakes_per_100: { type: number }
                      words_per_answer: { type: number }
                      hesitations_per_min: { type: number }
                      speaking_seconds: { type: number }
                  baseline: { type: object }
                  top_mistakes:
                    type: array
                    items: { type: object }
  /me:
    get:
      summary: Current student's profile (created on first call)
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401":
          description: Missing or invalid token
    patch:
      summary: Update the current student's level or explanation language
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeUpdate" }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401":
          description: Missing or invalid token
        "422":
          description: Empty body, unknown field or invalid value