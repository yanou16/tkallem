# DRAFT from the MVP spec. Change only by a PR approved by all three owners.
openapi: 3.1.0
info: { title: Tkallem API, version: 0.1.0 }
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk session token
    guestAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Visitor without account: `Authorization: Guest <token>`, the token comes from POST /guests. Accepted wherever bearerAuth is.'
  schemas:
    Correction:
      type: object
      required: [original, fixed, type, why]
      properties:
        original: { type: string }
        fixed: { type: string }
        type: { type: string, enum: [grammar, vocabulary, word_choice, other] }
        why: { type: string, description: Explanation in the session explain_lang }
        rule:
          type: [string, "null"]
          enum: [verb_tense, subject_verb_agreement, verb_pattern, preposition, article, plural_uncountable, word_order, word_form, other, null]
          description: Optional fine-grained category of the mistake (Top mistakes screen). Absent or null when unknown.
    SentenceStatus: { type: string, enum: [green, orange, red] }
    Me:
      type: object
      required: [first_name, level, explain_lang]
      properties:
        first_name: { type: [string, "null"] }
        level:
          type: [string, "null"]
          enum: [A2, B1, B2, C1, null]
          description: null until the student picks a level
        explain_lang: { type: string, enum: [en, fr] }
        is_guest: { type: boolean, description: "True for a visitor without account (Authorization: Guest ...)." }
    MeUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        level: { type: string, enum: [A2, B1, B2, C1] }
        explain_lang: { type: string, enum: [en, fr] }
    Turn:
      type: object
      required: [transcript, reply, corrections, sentence_status, finished]
      properties:
        transcript: { type: string }
        reply: { type: string }
        reply_audio_url: { type: [string, "null"] }
        corrections:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/Correction" }
        sentence_status: { $ref: "#/components/schemas/SentenceStatus" }
        praise:
          type: [string, "null"]
          description: "Improvement 4: one short true positive about the answer, shown before the corrections. Checked by the agent's code (never generic, never the mistake); null when refused."
        priority_index: { type: integer, minimum: 0, description: "The correction shown in full; the others are folded. 0 when there is none." }
        finished:
          type: boolean
          description: True once every question of a guided scenario is answered (show the report button). Always false in free talk.
        credits: { $ref: "#/components/schemas/Credits" }
    Credits:
      type: object
      required: [balance]
      properties:
        balance: { type: integer, minimum: 0, description: "Credits left. 1 credit = 1 answer from the student." }
        next_refill_at:
          type: [string, "null"]
          format: date-time
          description: Next daily refill (midnight UTC). Null for guests, who must sign in to get daily credits.
    NoCredits:
      type: object
      properties:
        code: { type: string, enum: [no_credits] }
        balance: { type: integer, enum: [0] }
        next_refill_at: { type: [string, "null"], format: date-time }
paths:
  /sessions:
    post:
      summary: Start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scenario_id]
              properties:
                scenario_id: { type: string }
                mode: { type: string, enum: [text, voice], default: text }
                explain_lang:
                  type: string
                  enum: [en, fr]
                  description: Defaults to the student's profile preference (GET /me).
      responses:
        "200":
          description: Session started
          content:
            application/json:
              schema:
                type: object
                required: [session_id, first_question]
                properties:
                  session_id: { type: string }
                  first_question:
                    type: object
                    properties:
                      text: { type: string }
                      audio_url: { type: [string, "null"] }
        "401": { description: Missing or invalid token }
        "404": { description: Unknown scenario }
        "409": { description: The student has not chosen a level yet (PATCH /me first) }
        "422": { description: Invalid body }
  /sessions/{id}:
    get:
      summary: The conversation so far (reload the chat screen, or continue a session later)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Session with its lines (text only, never audio)
          content:
            application/json:
              schema:
                type: object
                required: [session_id, scenario_id, title, mode, lines, finished, ended]
                properties:
                  session_id: { type: string }
                  scenario_id: { type: string }
                  title: { type: string }
                  mode: { type: string, enum: [text, voice] }
                  lines:
                    type: array
                    items:
                      type: object
                      properties:
                        role: { type: string, enum: [coach, student] }
                        text: { type: string }
                        status: { $ref: "#/components/schemas/SentenceStatus" }
                        corrections:
                          type: array
                          items: { $ref: "#/components/schemas/Correction" }
                        praise: { type: [string, "null"], description: "Student lines: the checked praise (improvement 4)" }
                        priority_index: { type: integer, minimum: 0, description: "Student lines: the correction shown in full" }
                  finished: { type: boolean, description: Every guided question answered (offer the report) }
                  ended: { type: boolean, description: The report was made, no more answers }
        "401": { description: Missing or invalid token }
        "404": { description: Session not found (or not this student's) }
  /sessions/{id}/speak:
    post:
      summary: Switch an ongoing session to voice; the coach says its last line again
      description: The session becomes a voice session (next replies come with audio). Limited to a few calls per session, each one is a paid voice request.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The coach's last line, with its audio (null if every voice provider failed)
          content:
            application/json:
              schema:
                type: object
                required: [text]
                properties:
                  text: { type: string }
                  audio_url: { type: [string, "null"] }
        "401": { description: Missing or invalid token }
        "404": { description: Session not found (or not this student's) }
        "409": { description: Session already ended }
        "429": { description: The coach already repeated this many times in this session }
  /sessions/{id}/hint:
    post:
      summary: '"Help me start" on the current question: the first words of an answer, or the student''s idea in English'
      description: |
        Free (no credit), at most 2 per question and 30 per hour per student. `starter` gives 1 or 2 openings that stop
        before the content; `translate` turns `text` (French or Darija) into English to read aloud. Both are checked by
        code; when the model's proposal is refused or the provider fails, the scenario's own starter comes back with
        `fallback: true` (and `kind: starter`, even for a translation).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type]
              properties:
                type: { type: string, enum: [starter, translate] }
                text: { type: [string, "null"], maxLength: 2000, description: "translate only: the idea in French or Darija" }
      responses:
        "200":
          description: The hint
          content:
            application/json:
              schema:
                type: object
                required: [kind, lines, fallback, remaining]
                properties:
                  kind: { type: string, enum: [starter, translation] }
                  lines: { type: array, minItems: 1, maxItems: 2, items: { type: string }, description: "starters are shown followed by …" }
                  fallback: { type: boolean }
                  remaining: { type: integer, description: Hints left for this question }
        "401": { description: Missing or invalid token }
        "404": { description: Session not found (or not this student's) }
        "409": { description: Session already ended, or the interview is over }
        "422": { description: Unknown type, or `translate` without text }
        "429": { description: 2 hints already for this question, or too many in the last hour }
  /sessions/{id}/repeat:
    post:
      summary: '"Say it again": the student says the corrected version of one of their answers'
      description: |
        Judged by code, not by the model: at least 85 % of the words of the corrected sentence, every corrected phrase
        heard, the mistake not said again (case, punctuation, contractions, number words and fillers ignored). Free, at
        most 3 tries per answer and 40 per hour per student; the interview does not move on, and it also works after
        the session ended. A recording that cannot be understood costs no try.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [turn, audio]
              properties:
                turn: { type: integer, minimum: 0, description: "Which answer, 0 = the first one" }
                audio: { type: string, format: binary }
      responses:
        "200":
          description: The verdict
          content:
            application/json:
              schema:
                type: object
                required: [nailed, heard, target, missing, similarity, tries_left]
                properties:
                  nailed: { type: boolean }
                  heard: { type: string }
                  target: { type: string, description: The corrected sentence }
                  missing: { type: array, items: { type: string }, description: Corrected phrases not heard, or said with the mistake again }
                  similarity: { type: number }
                  tries_left: { type: integer }
        "401": { description: Missing or invalid token }
        "404": { description: Session or answer not found }
        "409": { description: This answer had nothing to correct }
        "413": { description: Recording too long }
        "422": { description: Recording empty, silent or not understood (no try used) }
        "429": { description: 3 tries already for this answer, or too many in the last hour }
        "502": { description: Speech recognition unavailable }
  /sessions/{id}/turn:
    post:
      summary: Send one student turn (audio file or text)
      description: |
        JSON by default. With `Accept: text/event-stream` the answer is streamed as Server-Sent Events, each part as
        soon as it exists: `transcript` {text}, `reply` {text}, `corrections` {corrections, sentence_status, praise, priority_index},
        `audio` {audio_url} (voice sessions and spoken answers only; may come before or after corrections), then
        `done` {transcript, reply, corrections, sentence_status, praise, priority_index, finished, credits} once the turn is saved, or
        `error` {status, detail} (nothing saved, credit given back). Errors found before the stream starts (401, 402,
        404, 409, 413, 422, 429, 502 from speech recognition) are plain JSON responses as below.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                audio: { type: string, format: binary }
                text: { type: string }
                think_seconds: { type: string, description: "Freeze meter: seconds before the student started to answer, measured by the app. A value that is not a number is ignored." }
      responses:
        "200":
          description: Coach reply with corrections
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Turn" }
        "401": { description: Missing or invalid token }
        "404": { description: Session not found }
        "409": { description: Session already ended, or another answer was saved meanwhile (reload the session) }
        "422": { description: Empty or too long answer, or invalid session id }
        "402":
          description: No credits left (code no_credits). For a signed-in student, next_refill_at says when to come back; for a guest, ask to sign in.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail: { $ref: "#/components/schemas/NoCredits" }
        "429": { description: 'Everybody together used today''s free practice budget (code daily_budget_reached): come back tomorrow' }
        "502": { description: The coach failed. Nothing was saved, the student can send the same answer again }
  /sessions/{id}/end:
    post:
      summary: End the session and get the report
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                type: object
                required: [lines, note, metrics, levels, redo_index]
                properties:
                  lines:
                    type: array
                    items:
                      type: object
                      properties:
                        role: { type: string, enum: [coach, student] }
                        text: { type: string }
                        status: { $ref: "#/components/schemas/SentenceStatus" }
                        corrections:
                          type: array
                          items: { $ref: "#/components/schemas/Correction" }
                  note: { type: string }
                  freeze:
                    description: "Freeze meter: average seconds between the end of the coach's question and the first sound or letter, measured by the app and cleaned by the server (0 to 120 s). `previous`: the last finished session's, only for the same kind of answers (voice or typed). Null when no answer was measured."
                    oneOf:
                      - type: "null"
                      - type: object
                        required: [seconds, answers, kind]
                        properties:
                          seconds: { type: number }
                          answers: { type: integer }
                          kind: { type: string, enum: [voice, text, mixed] }
                          previous: { type: [number, "null"] }
                  progress:
                    type: [string, "null"]
                    description: "Improvement 4: the report's first line, progress since the student's last finished session (or the starting point), written by code from the metrics, never by the model."
                  metrics: { $ref: "#/paths/~1me~1progress/get/responses/200/content/application~1json/schema/properties/current" }
                  levels:
                    type: object
                    description: Traffic light per metric, null when the metric is not available (e.g. hesitations in text mode)
                    properties:
                      mistakes_per_100: { type: [string, "null"], enum: [green, orange, red, null] }
                      words_per_answer: { type: [string, "null"], enum: [green, orange, red, null] }
                      hesitations_per_min: { type: [string, "null"], enum: [green, orange, red, null] }
                  redo_index:
                    type: [integer, "null"]
                    description: Index in lines of the answer to redo first, if any
        "401": { description: Missing or invalid token }
        "404": { description: Session not found }
        "409": { description: Session already ended, or no answer given yet }
        "502": { description: The report could not be generated. Nothing was saved, try again }
  /me/progress:
    get:
      summary: Progress numbers and frequent mistakes
      responses:
        "200":
          description: Progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  current:
                    type: object
                    properties:
                      mistakes_per_100: { type: number }
                      words_per_answer: { type: number }
                      hesitations_per_min: { type: number }
                      speaking_seconds: { type: number }
                  baseline: { type: object }
                  top_mistakes:
                    type: array
                    items: { type: object }
  /scenarios:
    get:
      summary: Scenario cards (public, so the welcome page can list them before any account or guest exists)
      security: []
      responses:
        "200":
          description: Scenarios
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, title, mode]
                  properties:
                    id: { type: string }
                    title: { type: string }
                    description: { type: [string, "null"] }
                    category: { type: [string, "null"], enum: [travel, study, work, exams, speaking, null] }
                    level: { type: [string, "null"], enum: [A2, B1, B2, C1, null] }
                    icon: { type: [string, "null"] }
                    mode: { type: string, enum: [guided, free] }
                    minutes: { type: [integer, "null"] }
                    total_questions: { type: [integer, "null"], description: Null for free talk }
  /guests:
    post:
      summary: Start as a visitor without account
      description: "Returns a signed token to send as `Authorization: Guest <token>` and the guest credits (40). Rate limited per network address and per day."
      security: []
      responses:
        "201":
          description: Guest created
          content:
            application/json:
              schema:
                type: object
                required: [guest_token, credits]
                properties:
                  guest_token: { type: string }
                  credits: { $ref: "#/components/schemas/Credits" }
        "429": { description: 'Too many visitors from this network today (code: guest_limit): ask the student to sign in' }
        "503": { description: Guest mode is not enabled on this server }
  /me/credits:
    get:
      summary: Credit balance and next refill (works for guests and signed-in students)
      responses:
        "200":
          description: Credits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credits" }
        "401": { description: Missing or invalid token }
  /me/claim-guest:
    post:
      summary: After sign-in, bring the guest's sessions and remaining credits to the account
      description: Credits are transferred once per account; replaying the token transfers nothing. Not available to guests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [guest_token]
              properties:
                guest_token: { type: string }
      responses:
        "200":
          description: Transfer done (possibly 0 credits)
          content:
            application/json:
              schema:
                type: object
                required: [transferred, credits]
                properties:
                  transferred: { type: integer, minimum: 0 }
                  credits: { $ref: "#/components/schemas/Credits" }
        "403": { description: A guest cannot claim; sign in first }
        "422": { description: Invalid guest token }
  /me:
    get:
      summary: Current student's profile (created on first call)
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401":
          description: Missing or invalid token
    patch:
      summary: Update the current student's level or explanation language
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeUpdate" }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401":
          description: Missing or invalid token
        "422":
          description: Empty body, unknown field or invalid value