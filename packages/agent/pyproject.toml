[project]
name = "tkallem-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["langgraph", "langchain", "langchain-core", "langchain-groq", "langchain-openai", "pydantic", "langfuse"]

[project.optional-dependencies]
cefr-space = ["gradio_client"]
cli = ["python-dotenv"]
test = ["pytest", "jsonschema", "pyyaml"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tkallem_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
