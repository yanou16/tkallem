[project]
name = "tkallem-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["langgraph", "langchain", "langchain-core", "langchain-groq", "langchain-openai", "pydantic", "langfuse", "python-dotenv"]

[project.optional-dependencies]
cefr-space = ["gradio_client"]
test = ["pytest", "jsonschema", "pyyaml"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tkallem_agent"]

[tool.setuptools.package-data]
tkallem_agent = ["prompts/*.md", "scenarios/*.json"]  # shipped with the package, not only in editable installs

[tool.pytest.ini_options]
testpaths = ["tests"]
