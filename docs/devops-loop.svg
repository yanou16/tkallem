<text x="972" y="711" font-size="20" font-weight="700" fill="#1c1c1e">Monitor</text>
<text x="930" y="742" font-size="17" fill="#555a6a">/health, Langfuse traces,</text>
<text x="930" y="765" font-size="17" fill="#555a6a">spend alert at 80 % of the</text>
<text x="930" y="788" font-size="17" fill="#555a6a">cap.</text>
<text x="640" y="856" text-anchor="middle" font-size="16" fill="#555a6a">Every change goes round the whole loop. Nothing reaches production without passing the tests.</text>
