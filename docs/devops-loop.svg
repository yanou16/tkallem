<text x="350" y="742" font-size="17" fill="#555a6a">Vercel (web), Azure App</text>
<text x="350" y="765" font-size="17" fill="#555a6a">Service (API), then a smoke</text>
<text x="350" y="788" font-size="17" fill="#555a6a">test.</text>
