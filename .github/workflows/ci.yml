# Tests on every push and pull request. Database tests are skipped here (no TEST_DATABASE_URL): run them locally
# against a scratch Neon branch. LLM evals are not run here (they cost money and need keys): see packages/agent/README.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install
        working-directory: apps/api
        run: pip install -r requirements.txt jsonschema pyyaml
      - name: Agent tests
        working-directory: packages/agent
        run: pytest -q
      - name: API tests
        working-directory: apps/api
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
