# Builds the API image on every change to the API or the agent, pushes it to GitHub Container Registry, then (once the
# Azure secrets exist) deploys it to Azure App Service. Setup: infra/azure/README.md.
name: API image

on:
  push:
    branches: [main]
    paths: ["apps/api/**", "packages/agent/**", ".dockerignore", ".github/workflows/api-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/tkallem-api

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "image=${IMAGE,,}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3   # the GitHub Actions build cache needs Buildx, not the plain docker driver
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}
            ${{ env.IMAGE }}:latest
          build-args: TKALLEM_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Skipped until the App Service exists and its publish profile is stored as a repository secret.
    if: ${{ vars.AZURE_WEBAPP_NAME != '' }}
    environment: production
    steps:
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ needs.build.outputs.image }}
      - name: Smoke test (the new version is live and answers)
        run: |
          url="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          for i in $(seq 1 60); do
            version=$(curl -s -m 10 "$url/health" | python3 -c "import json,sys; print(json.load(sys.stdin).get('version',''))" 2>/dev/null || true)
            [ "$version" = "$GITHUB_SHA" ] && break
            sleep 10
          done
          if [ "$version" != "$GITHUB_SHA" ]; then echo "::error::$url/health still reports '$version', expected $GITHUB_SHA"; exit 1; fi
          count=$(curl -s -m 10 "$url/scenarios" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
          [ "$count" -ge 1 ] || { echo "::error::/scenarios returned $count scenarios"; exit 1; }
          echo "Live: $GITHUB_SHA, $count scenarios"
